name: Collect auction prices

on:
  schedule:
    - cron: "17 * * * *"   # every hour (UTC).
  workflow_dispatch:          # lets you run it by hand

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Remembers which auctions existed last run, to estimate how much sold. Not stored in the repo.
      - name: Restore auction state
        uses: actions/cache/restore@v4
        with:
          path: state
          key: auctions-none
          restore-keys: auctions-

      - name: Collect prices
        env:
          BNET_CLIENT_ID: ${{ secrets.BNET_CLIENT_ID }}
          BNET_CLIENT_SECRET: ${{ secrets.BNET_CLIENT_SECRET }}
        run: python collect.py

      - name: Save auction state
        if: always() && hashFiles('state/auctions.json.gz') != ''
        uses: actions/cache/save@v4
        with:
          path: state
          key: auctions-${{ github.run_id }}

      - name: Save results to repo
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for f in data items.json vendor.json quality.json professions.json icons.json skills.json ladder.json.gz runs.csv house_choice.json sales; do [ -e "$f" ] && git add "$f"; done; true
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "Run $(date -u '+%Y-%m-%d %H:%M') UTC"
            git pull --rebase --autostash || true
            git push
          fi
